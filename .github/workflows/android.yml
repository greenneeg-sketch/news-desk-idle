# 안드로이드 앱 빌드: main에 웹 게임이나 app/ 이 바뀌면 자동으로 APK(테스트 설치용)와 AAB(플레이 스토어 업로드용)를 만든다.
# 서명 키는 저장소 Settings → Secrets and variables → Actions 에 넣는다(app/README-ANDROID.md 참고). 키가 없으면 서명 안 된 AAB가 나온다.
name: Android build
on:
  push:
    branches: [main]
    paths: ['index.html', 'icons/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 웹 게임을 앱에 넣기
        working-directory: app
        run: npm ci && npm run sync
      - name: 서명 키 준비
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: APK·AAB 빌드
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: news-desk-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/android/app/build/outputs/bundle/release/*.aab
